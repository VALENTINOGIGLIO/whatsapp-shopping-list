services:
  - type: web
    name: whatsapp-shopping-list
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: RENDER_EXTERNAL_URL
        value: "https://whatsapp-shopping-list.onrender.com"
      - key: USE_FIRESTORE
        value: "true"

