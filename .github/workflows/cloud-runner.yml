name: Cloud Runner 24/7 (Self-Healing Backup)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main

jobs:
  preflight:
    name: Pre-flight Guard (Concurrency & Failover)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Check Active Runners & Render Status
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔍 Evaluating pre-flight conditions..."

          # 1. Check if another cloud-runner is in_progress
          ACTIVE_RUNS=$(gh run list --repo VALENTINOGIGLIO/whatsapp-shopping-list --workflow=cloud-runner.yml --status=in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" || echo "0")
          echo "Active runners count (excluding self): $ACTIVE_RUNS"

          if [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "✅ Another cloud-runner instance is already active ($ACTIVE_RUNS running). Skipping runner."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Check if Render primary instance is active and READY
          RENDER_CODE=$(curl -s -o /tmp/render_health.json -w "%{http_code}" --max-time 10 https://whatsapp-shopping-list.onrender.com/health || echo "000")
          if [ "$RENDER_CODE" = "200" ]; then
            if grep -q '"status":"READY"' /tmp/render_health.json || grep -q '"whatsappStatus":"READY"' /tmp/render_health.json; then
              echo "✅ Render primary instance is active and READY. Skipping cloud backup."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "ℹ️ Render returned 200 but WhatsApp status is not READY. Cloud backup runner will start."
            fi
          else
            echo "ℹ️ Render primary instance is suspended/offline (HTTP $RENDER_CODE). Cloud backup runner will start."
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  run-bot:
    name: WhatsApp Bot Runner (5h Cycle)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute WhatsApp Bot & Monitor (5h cycle)
        env:
          USE_FIRESTORE: "true"
          EXIT_ON_CONFLICT: "true"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PORT: "3000"
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Launching WhatsApp Bot on Cloud Runner..."
          node src/whatsapp/whatsappClient.js &
          BOT_PID=$!
          echo "Bot PID: $BOT_PID"

          cleanup() {
            echo "🛑 Caught signal, stopping WhatsApp Bot PID $BOT_PID gracefully..."
            kill -TERM $BOT_PID 2>/dev/null || true
            wait $BOT_PID 2>/dev/null || true
            exit 0
          }
          trap cleanup SIGTERM SIGINT

          # Wait for initial boot and connection
          sleep 10

          ITER=0
          MAX_ITER=300

          while [ $ITER -lt $MAX_ITER ]; do
            ITER=$((ITER + 1))

            # 1. Heartbeat check
            HEALTH=$(curl -s --max-time 5 http://localhost:3000/health || echo '{"status":"error"}')
            echo "💓 [Heartbeat $ITER/$MAX_ITER] $HEALTH"

            # 2. Process health & crash check
            if ! kill -0 $BOT_PID 2>/dev/null; then
              wait $BOT_PID 2>/dev/null
              EXIT_STATUS=$?
              echo "⚠️ Bot process $BOT_PID exited with code $EXIT_STATUS"
              if [ $EXIT_STATUS -eq 0 ]; then
                echo "🚪 Bot exited cleanly (code 0, yielding to another instance). Exiting."
                exit 0
              fi
              echo "🔄 Bot crashed with code $EXIT_STATUS. Restarting inside current runner..."
              node src/whatsapp/whatsappClient.js &
              BOT_PID=$!
              echo "New Bot PID: $BOT_PID"
              sleep 5
            fi

            # 3. Check Render primary failover every 10 iterations (10 minutes)
            if [ $((ITER % 10)) -eq 0 ]; then
              R_STATUS=$(curl -s -o /tmp/r_health.json -w "%{http_code}" --max-time 10 https://whatsapp-shopping-list.onrender.com/health || echo "000")
              if [ "$R_STATUS" = "200" ]; then
                if grep -q '"status":"READY"' /tmp/r_health.json || grep -q '"whatsappStatus":"READY"' /tmp/r_health.json; then
                  echo "✅ Render primary instance is back online and READY! Gracefully yielding cloud runner."
                  kill -TERM $BOT_PID 2>/dev/null || true
                  wait $BOT_PID 2>/dev/null || true
                  exit 0
                fi
              fi
            fi

            sleep 60
          done

          echo "⏰ 5 hours completed (300 iterations). Performing zero-conflict handoff..."
          kill -TERM $BOT_PID 2>/dev/null || true
          wait $BOT_PID 2>/dev/null || true
          sleep 2

          echo "🚀 Triggering next cloud-runner workflow cycle..."
          gh workflow run cloud-runner.yml --ref main --repo VALENTINOGIGLIO/whatsapp-shopping-list
          echo "✅ Next cycle successfully dispatched."
